name: data_layer_firestore
description: Provides Firestore-specific bindings for pkg:data_layer.
repository: https://github.com/craiglabenz/dash_data_layer
version: 0.0.3

environment:
  sdk: ^3.10.0
  flutter: ">=1.17.0"

dependencies:
  cloud_firestore: ^6.3.0
  data_layer: ^0.0.8
  firebase_core: ^4.7.0
  flutter:
    sdk: flutter
  logging: ^1.3.0
  stream_transform: ^2.1.0

dev_dependencies:
  fake_cloud_firestore: 4.1.0+1
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  very_good_analysis: ^10.0.0

dependency_overrides:
  data_layer: 
    path: ../data_layer